; 이 파일을 실행 파일 옆 또는 프로젝트 루트에 ServerRuntime.ini 이름으로 복사해서 사용한다.
; 클라이언트 실행 전에 ServerHost에 시연장 서버 실행용 PC의 IPv4 주소를 입력한다.

[ProjectP.Server]
ServerHost=
GameBackendPort=8080
LoginServerPort=8080
LobbyServerPort=7777
DungeonServerPort=7778
bRequireLobbyTokenVerification=True
DungeonStateServerAuthKey=change-me-dungeon-state-key
